# Xcode project definition. Generate the project with:  xcodegen generate
# The generated EatBetter.xcodeproj is not committed (see docs/DECISIONS.md, D-004).
name: EatBetter
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  EatBetterCore:
    path: Packages/EatBetterCore

targets:
  EatBetter:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: EatBetterCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Eat Better
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # The private-data copy script reads Private/, outside the sandboxed inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Copy private data
        path: scripts/copy-private-data.sh
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
